<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캡컷 에이전트</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #161616;
    --line: #262626;
    --text: #ededed;
    --dim: #8a8a8a;
    --faint: #5a5a5a;
    --accent: #22c55e;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 13px/1.6 ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    padding: 28px 20px 64px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .meta { color: var(--dim); font-size: 12px; }

  hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }

  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    display: inline-block; flex: none; background: var(--faint);
  }
  .dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot.run { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .dot.bad { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 var(--accent); opacity: .45; }
    50% { box-shadow: 0 0 8px var(--accent); opacity: 1; }
  }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
           background: var(--line); border: 1px solid var(--line); }
  .stat { background: var(--bg); padding: 14px 16px; }
  .stat b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .stat span { color: var(--dim); font-size: 11px; text-transform: uppercase;
               letter-spacing: .08em; }

  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); padding: 6px 12px; cursor: pointer;
    border-radius: 4px;
  }
  button:hover:not(:disabled) { border-color: var(--faint); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.go { border-color: var(--accent); color: var(--accent); }
  button.bad:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

  label { color: var(--dim); font-size: 11.5px; display: flex;
          align-items: center; gap: 6px; }
  input[type=number] {
    font: inherit; font-variant-numeric: tabular-nums;
    color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 8px; width: 62px; text-align: right;
  }
  input[type=number]:focus { outline: 0; border-color: var(--accent); }
  .hint { color: var(--faint); font-size: 11.5px; margin-top: 8px; }

  code {
    background: var(--card); border: 1px solid var(--line); border-radius: 3px;
    padding: 1px 6px; font-size: 11.5px; color: var(--dim);
  }

  .job { padding: 14px 0; border-top: 1px solid var(--line); }
  .job:first-child { border-top: 0; }
  .job-head { display: flex; align-items: center; gap: 9px; }
  .job-name { font-weight: 600; flex: 1; min-width: 0;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-state { color: var(--dim); font-size: 11.5px; }
  .job-msg { color: var(--faint); font-size: 11.5px; margin: 5px 0 0 15px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 9px 0 0 15px; }
  .acts { display: flex; gap: 6px; margin: 10px 0 0 15px; }
  .err { color: var(--danger); font-size: 11.5px; margin: 6px 0 0 15px;
         white-space: pre-wrap; }

  .checks { display: flex; flex-wrap: wrap; gap: 14px; }
  .chk { display: flex; align-items: center; gap: 7px; color: var(--dim);
         font-size: 11.5px; }
  .empty { color: var(--faint); padding: 28px 0; text-align: center; }
  .fix { color: var(--dim); font-size: 11.5px; margin-top: 8px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot" id="live"></span>
    <h1>캡컷 에이전트</h1>
    <span class="meta" id="track">…</span>
  </header>

  <hr>
  <div class="checks" id="checks"></div>
  <div class="fix" id="fix"></div>

  <hr>
  <div class="stats" id="stats"></div>

  <hr>
  <div class="bar">
    <label>제작 방식
      <select id="mode">
        <option value="lecture">강의 숏폼 — 원본 소리 그대로</option>
        <option value="voice" disabled>AI 보이스 — 준비 중</option>
      </select>
    </label>
    <label>숏폼 개수
      <input type="number" id="count" min="0" max="20" step="1" value="0">
    </label>
    <label>제목 배치
      <select id="titleLayout">
        <option value="중앙">중앙 — 화면을 채움</option>
        <option value="상단">상단 — 얼굴 위 두 줄</option>
      </select>
    </label>
    <label>제목 색
      <select id="titlePalette">
        <option value="green">초록 + 검정</option>
        <option value="red">빨강 + 검정</option>
      </select>
    </label>
    <span class="meta">9:16</span>
    <button class="go" id="scan">지금 훑기</button>
    <span class="meta" id="watch">…</span>
  </div>
  <div class="hint" id="countHint"></div>
  <div class="bar" style="margin-top:10px">
    <code id="inbox">…</code>
    <button id="open">폴더 열기</button>
  </div>
  <div class="bar" style="margin-top:10px">
    <label>클로드 API 키
      <input type="password" id="key" placeholder="sk-ant-…" autocomplete="off">
    </label>
    <button id="saveKey">저장</button>
    <span class="meta" id="keyState">…</span>
  </div>
  <div class="hint">키를 넣으면 클로드가 대본을 읽고 숏폼 구간을 고릅니다.
    없으면 낱말·자리 규칙으로 고릅니다.</div>

  <div class="bar" style="margin-top:10px">
    <label>드라이브 클라이언트 ID
      <input type="text" id="gid" placeholder="….apps.googleusercontent.com" autocomplete="off">
    </label>
    <label>시크릿
      <input type="password" id="gsecret" placeholder="GOCSPX-…" autocomplete="off">
    </label>
  </div>
  <div class="bar" style="margin-top:10px">
    <label>받을 폴더
      <input type="text" id="gfolder" placeholder="폴더 주소를 붙여 넣으세요 (비우면 앱 폴더)">
    </label>
    <button id="saveDrive">저장</button>
    <button id="connectDrive">연결</button>
    <span class="meta" id="driveState">…</span>
  </div>
  <div class="hint">비워 두면 앱이 자기 폴더를 만들어 넣습니다.
    이미 쓰던 폴더에 넣으려면 전체 권한이 필요합니다.</div>

  <hr>
  <div id="jobs"><div class="empty">작업이 없습니다. inbox 에 영상을 넣고 훑어 보세요.</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const jobs = new Map();

const STAGE = {
  extract: "오디오 추출", asr: "전사", cut: "컷 계산",
  subtitle: "자막 배치", draft: "드래프트 작성", media: "미디어 반입",
  done: "완료", failed: "실패",
};

function dotClass(status) {
  if (status === "running") return "dot run";
  if (status === "failed") return "dot bad";
  if (status === "uploading") return "dot run";
  if (["review", "approved", "uploaded", "published"].includes(status))
    return "dot on";
  return "dot";
}

function fact(label, value) {
  return value === undefined || value === null || value === ""
    ? "" : `<code>${label} ${value}</code>`;
}

function render() {
  const list = [...jobs.values()].sort((a, b) =>
    (b.createdAt || "").localeCompare(a.createdAt || ""));
  if (!list.length) {
    $("jobs").innerHTML =
      '<div class="empty">작업이 없습니다. inbox 에 영상을 넣고 훑어 보세요.</div>';
    return;
  }
  $("jobs").innerHTML = list.map((job) => {
    const s = job.result?.summary || {};
    const facts = [
      fact("해상도", s.resolution),
      fact("길이", s.durationSec ? s.durationSec.toFixed(1) + "s" : ""),
      fact("컷", s.cutPieces ? s.cutPieces + "조각" : ""),
      fact("자막", s.cues ? s.cues + "장" : ""),
      fact("모션", s.motion),
      fact("캔버스", s.canvas),
      fact("걸린 시간", job.result?.elapsedSec ? job.result.elapsedSec + "s" : ""),
    ].join("");
    const acts = [];
    if (job.status === "review")
      acts.push(`<button class="go" data-act="approve" data-id="${job.id}">검수 완료</button>`);
    if (job.summary && job.summary.post)
      acts.push(`<button data-act="copy" data-id="${job.id}">게시문구 복사</button>`);
    if (["approved", "uploaded"].includes(job.status))
      acts.push(`<button data-act="reopen" data-id="${job.id}">재검수</button>`);
      acts.push(`<button class="go" data-act="send" data-id="${job.id}">드라이브로 보내기</button>`);
    if (job.status === "failed")
      acts.push(`<button data-act="retry" data-id="${job.id}">다시</button>`);
    if (job.status !== "running")
      acts.push(`<button class="bad" data-act="remove" data-id="${job.id}">삭제</button>`);
    const stage = STAGE[job.stage] || job.stage;
    return `<div class="job">
      <div class="job-head">
        <span class="${dotClass(job.status)}"></span>
        <span class="job-name">${job.name}</span>
        <span class="job-state">${job.statusLabel}${stage ? " · " + stage : ""}</span>
      </div>
      ${job.message ? `<div class="job-msg">${job.message}</div>` : ""}
      ${job.error ? `<div class="err">${job.error}</div>` : ""}
      ${facts ? `<div class="facts">${facts}</div>` : ""}
      ${s.draft ? `<div class="facts"><code>${s.draft}</code></div>` : ""}
      ${acts.length ? `<div class="acts">${acts.join("")}</div>` : ""}
    </div>`;
  }).join("");
}

async function api(path, options) {
  const response = await fetch(path, {
    headers: { "Content-Type": "application/json" }, ...options,
  });
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.detail || response.statusText);
  }
  return response.json();
}

$("saveDrive").onclick = async (event) => {
  event.target.disabled = true;
  try {
    // 비밀값은 비워 보내면 서버가 그대로 둔다. 폴더만 바꾸려다 연결이
    // 끊기면 안 된다.
    const drive = await api("/api/drive/settings", {
      method: "POST",
      body: JSON.stringify({
        clientId: $("gid").value,
        clientSecret: $("gsecret").value,
        folder: $("gfolder").value,
        full: Boolean($("gfolder").value.trim()),
      }),
    });
    $("gsecret").value = "";
    showDrive(drive);
  } catch (error) {
    alert(error.message);
  } finally {
    event.target.disabled = false;
  }
};

$("connectDrive").onclick = async (event) => {
  event.target.disabled = true;
  try {
    const { url } = await api("/api/drive/connect");
    window.open(url, "_blank");
  } catch (error) {
    alert(error.message);
  } finally {
    event.target.disabled = false;
  }
};

function showDrive(drive) {
  if (!drive) return;
  $("driveState").textContent = drive.connected
    ? `연결됨${drive.folderId ? " — 지정 폴더" : " — 앱 폴더"}`
    : "연결 안 됨";
  if (drive.clientId && !$("gid").value) $("gid").placeholder = drive.clientId;
  if (drive.folderId && !$("gfolder").value) $("gfolder").placeholder = drive.folderId;
}

$("saveKey").onclick = async (event) => {
  event.target.disabled = true;
  try {
    const result = await api("/api/settings/key", {
      method: "POST", body: JSON.stringify({ key: $("key").value }),
    });
    // 저장한 키를 다시 화면에 꺼내 두지 않는다.
    $("key").value = "";
    showKey(result.apiKey);
  } catch (error) {
    alert(error.message);
  } finally {
    event.target.disabled = false;
  }
};

function showKey(value) {
  $("keyState").textContent = value
    ? `${value} — 클로드가 대본을 읽습니다`
    : "없음 — 규칙으로 고릅니다";
}

$("open").onclick = async (event) => {
  // 영상을 넣을 폴더다. 경로를 손으로 복사하게 두지 않는다.
  event.target.disabled = true;
  try {
    await api("/api/reveal/inbox", { method: "POST" });
  } catch (error) {
    alert(error.message);
  } finally {
    event.target.disabled = false;
  }
};

function describeCount() {
  const n = Number($("count").value) || 0;
  $("countHint").textContent = n === 0
    ? "0 = 영상 하나를 통째로 — 무음 컷 + 자막"
    : `${n} = 영상 하나에서 점수 상위 ${n}개를 숏폼으로 뽑음 (9:16)`;
}
$("count").oninput = () => {
  describeCount();
  localStorage.setItem("capcut.count", $("count").value);
};
$("count").value = localStorage.getItem("capcut.count") || "0";
describeCount();

async function refresh() {
  const [status, listing] = await Promise.all([
    api("/api/status"), api("/api/jobs"),
  ]);
  $("track").textContent = `${status.trackLabel} · ASR ${status.asr}`;
  $("inbox").textContent = status.workspace.inbox;
  showKey(status.apiKey);
  showDrive(status.drive);
  $("live").className = status.workerRunning ? "dot on" : "dot bad";
  $("watch").textContent = status.watcherRunning
    ? "inbox 자동 감지 켜짐" : "자동 감지 꺼짐";

  $("checks").innerHTML = status.checks.map((c) =>
    `<span class="chk"><span class="dot ${c.ok ? "on" : "bad"}"></span>${c.name}</span>`
  ).join("");
  const broken = status.checks.filter((c) => !c.ok && c.fix);
  $("fix").innerHTML = broken.map((c) => `${c.name} → <code>${c.fix}</code>`).join("<br>");

  const counts = status.counts;
  $("stats").innerHTML = [
    ["편집 대기 · 중", counts.queued + counts.running],
    ["검수 대기", counts.review],
    ["게시 대기", counts.approved + counts.uploading + counts.uploaded],
  ].map(([label, n]) => `<div class="stat"><b>${n}</b><span>${label}</span></div>`).join("");

  jobs.clear();
  listing.jobs.forEach((job) => jobs.set(job.id, job));
  render();
}

$("scan").onclick = async (event) => {
  event.target.disabled = true;
  try {
    const result = await api("/api/scan", {
      method: "POST",
      body: JSON.stringify({
        options: {
          shortsCount: Number($("count").value) || 0,
          titleLayout: $("titleLayout").value,
          titlePalette: $("titlePalette").value,
        },
      }),
    });
    if (!result.added) alert(`새 영상이 없습니다 (inbox ${result.found}개)`);
    await refresh();
  } catch (error) {
    alert(error.message);
  } finally {
    event.target.disabled = false;
  }
};

$("jobs").onclick = async (event) => {
  const button = event.target.closest("button[data-act]");
  if (!button) return;
  const { act, id } = button.dataset;
  button.disabled = true;
  try {
    if (act === "copy") {
      // 올리는 건 사람이 한다. 여기서는 붙여 쓸 글만 넘긴다.
      const detail = await api(`/api/jobs/${id}`);
      const text = detail.postText || "";
      if (!text) {
        alert("게시문구가 아직 없습니다.");
      } else {
        try {
          await navigator.clipboard.writeText(text);
          button.textContent = "복사됨";
        } catch (error) {
          // 클립보드를 막는 브라우저가 있다. 그때는 눈으로 보고 긁어 간다.
          window.prompt("복사해 쓰세요", text);
        }
      }
      button.disabled = false;
      return;
    }
    if (act === "remove") {
      await api(`/api/jobs/${id}`, { method: "DELETE" });
      jobs.delete(id);
      render();
    } else {
      await api(`/api/jobs/${id}/${act}`, { method: "POST" });
    }
    await refresh();
  } catch (error) {
    alert(error.message);
    button.disabled = false;
  }
};

const stream = new EventSource("/api/events");
stream.onmessage = (event) => {
  const data = JSON.parse(event.data);
  if (data.kind === "job") {
    jobs.set(data.job.id, data.job);
    render();
  } else if (data.kind === "removed") {
    jobs.delete(data.id);
    render();
  }
};
stream.onerror = () => { $("live").className = "dot bad"; };

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
